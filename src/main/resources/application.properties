spring.application.name=SpringBot

# Time between API request and automation
automation.keyboard.initial-delay-ms=2000

# AWT
spring.main.headless=false
automation.keyboard.initial-delay-ms=1000

# Switch to previously active application
automation.keyboard.switch-application=true

# Start typing immediately after Command+Tab
automation.keyboard.switch-delay-ms=0

# Logging
logging.level.root=INFO
logging.level.com.achhecode.SpringBot=DEBUG

# Log file
logging.file.name=logs/springbot.log

# Rolling policy
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.clean-history-on-start=false